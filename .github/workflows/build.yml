name: Build OpenWrt for KuWFi MT7628

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: v23.05.5
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev gawk git libssl-dev gettext unzip python3 rsync wget time file bc
    
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Create .config file
      run: |
        echo 'CONFIG_TARGET_ramips=y' >> .config
        echo 'CONFIG_TARGET_ramips_mt76x8=y' >> .config
        echo 'CONFIG_TARGET_ramips_mt76x8_DEVICE_kuwfi_a8_v1.5=y' >> .config
        echo 'CONFIG_PACKAGE_luci=y' >> .config
        echo 'CONFIG_PACKAGE_luci-base=y' >> .config
        echo 'CONFIG_PACKAGE_luci-mod-admin-full=y' >> .config
        echo 'CONFIG_PACKAGE_luci-theme-bootstrap=y' >> .config
        echo 'CONFIG_PACKAGE_uhttpd=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-mt7603=y' >> .config
        echo 'CONFIG_PACKAGE_iw=y' >> .config
        echo 'CONFIG_PACKAGE_wpad-basic-mbedtls=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb2=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb-net=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb-serial=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb-serial-option=y' >> .config
        echo 'CONFIG_PACKAGE_uqmi=y' >> .config
        echo 'CONFIG_PACKAGE_luci-proto-qmi=y' >> .config
        echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' >> .config
        echo 'CONFIG_TARGET_IMAGES_GZIP=y' >> .config
        echo 'CONFIG_ALL_KMODS=n' >> .config
        echo 'CONFIG_ALL=n' >> .config
        cat .config
    
    - name: Download sources
      run: make download -j8
    
    - name: Build
      run: make -j$(nproc)
      timeout-minutes: 90
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-kuwfi
        path: bin/targets/ramips/mt76x8/*.bin
