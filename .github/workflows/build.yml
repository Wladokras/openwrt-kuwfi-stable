name: Build OpenWrt for KuWFi MT7628

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: v23.05.5
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev gawk git libssl-dev gettext unzip python3 rsync wget time file bc
    
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Create .config file
      run: |
        cat > .config << 'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt76x8=y
        CONFIG_TARGET_ramips_mt76x8_DEVICE_kuwfi_a8_v1.5=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_uhttpd=y
        CONFIG_PACKAGE_kmod-mt7603=y
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_wpad-basic-mbedtls=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_luci-proto-qmi=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_ALL_KMODS=n
        CONFIG_ALL=n
        EOF
        cat .config
    
    - name: Defconfig (prepare build)
      run: make defconfig
    
    - name: Download sources
      run: make download -j8
    
    - name: Build
      run: make -j$(nproc)
      timeout-minutes: 90
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-kuwfi
        path: bin/targets/ramips/mt76x8/*.bin